version: "3.9"

# Local development stack: Kafka (KRaft mode, no Zookeeper), Postgres,
# and Prometheus/Grafana for the observability story described in the JD.
services:
  kafka:
    image: apache/kafka:3.7.1
    container_name: trading-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    environment:
      POSTGRES_DB: trade_capture
      POSTGRES_USER: trade_capture
      POSTGRES_PASSWORD: trade_capture
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  trade-capture-service:
    build:
      context: .
      dockerfile: apps/trade-capture-service/Dockerfile
    container_name: trade-capture-service
    depends_on:
      - kafka
      - postgres
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: postgres
      DB_PORT: 5432

  pnl-risk-consumer:
    build:
      context: .
      dockerfile: apps/pnl-risk-consumer/Dockerfile
    container_name: pnl-risk-consumer
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  frontend:
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    container_name: trading-frontend
    ports:
      - "4200:80"
    depends_on:
      - trade-capture-service
      - pnl-risk-consumer

volumes:
  pgdata:
