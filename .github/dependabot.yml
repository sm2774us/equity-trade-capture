version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    # Major-version bumps of framework-defining packages (Angular, Nx,
    # TypeScript, Tailwind, the various ESLint plugins) require coordinated
    # manual migration — new peer-dependency ranges, breaking API changes —
    # that Dependabot cannot safely automate even with grouping. Every
    # ERESOLVE failure seen in CI so far was exactly this: a major bump
    # landing on one package while a peer elsewhere stayed pinned. Minor/
    # patch bumps stay fully automated; majors still show up in the
    # Dependabot UI for manual review, just not as an auto-opened PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Nx requires every @nx/* package (and the nx CLI itself) to stay on
      # the exact same version — a single-package bump (e.g. @nx/playwright
      # alone) breaks the workspace. Grouping forces them to move together
      # in one PR, or not at all.
      nx:
        patterns:
          - "nx"
          - "@nx/*"
      # Same constraint for Angular: @angular/core, @angular/cli,
      # @angular/compiler-cli etc. must share a major/minor version.
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@angular-eslint/*"

  - package-ecosystem: "maven"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message:
      prefix: "chore"
    groups:
      # spring-boot-starter-parent pins the whole Spring Boot BOM; letting
      # one spring-boot-* artifact drift from the parent version breaks
      # dependency resolution.
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.kafka:*"

  - package-ecosystem: "gradle"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message:
      prefix: "chore"
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.kafka:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/apps/trade-capture-service"
    schedule: { interval: "weekly" }
    commit-message:
      prefix: "chore"

  - package-ecosystem: "docker"
    directory: "/apps/pnl-risk-consumer"
    schedule: { interval: "weekly" }
    commit-message:
      prefix: "chore"

  - package-ecosystem: "docker"
    directory: "/apps/frontend"
    schedule: { interval: "weekly" }
    commit-message:
      prefix: "chore"
