name: PR Verification (Isolated Feature Testing)

on:
  pull_request:
    branches: [main]

# Cancels any older builds on the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title-lint:
    name: Enforce Conventional Commit PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Lint, Scan, and Test Affected App Graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Nx needs full history to calculate affected projects

      - name: Setup Node.js Runtime
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 17 Engine
        uses: actions/setup-java@8a4421b40c212260662d989f64e2e2832c3f1f7d # v4.3.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Clean Install NPM Dependencies
        run: npm ci

      - name: Synchronize Nx Affected Base Commit Context
        uses: nrwl/nx-set-shas@43df4d1a58ebcd62b5d43e5362df5057a66cd53b # v4.1.3

      - name: Execute Polyglot Code Linters (Frontend)
        run: npx nx affected --target=lint --parallel=3

      - name: Run Vulnerability Scan on Dependencies
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "HIGH,CRITICAL"

      - name: Run Frontend Test Suites (Jest, Affected)
        run: npx nx affected --target=test --parallel=2 --configuration=ci

      - name: Run Frontend Production Build (Affected)
        run: npx nx affected --target=build --parallel=2

      - name: Run Java Backend Tests (Maven, Full Reactor)
        run: mvn -B -q verify

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d156388eb19639ec20ade50009f3d199ce1e2808 # v4.1.0
        with:
          gradle-version: "8.10"

      - name: Run Java Backend Build (Gradle, Verification Parity)
        run: gradle build -x test --no-daemon

      - name: Upload JaCoCo Coverage Reports
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6a1 # v4.4.0
        with:
          name: jacoco-coverage-reports
          path: |
            apps/trade-capture-service/target/site/jacoco/**
            apps/pnl-risk-consumer/target/site/jacoco/**

  e2e:
    name: Frontend End-to-End (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx nx e2e frontend
