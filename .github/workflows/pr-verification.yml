name: PR Verification (Isolated Feature Testing)

on:
  pull_request:
    branches: [main]

# Cancels any older builds on the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title-lint:
    name: Enforce Conventional Commit PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Lint, Scan, and Test Affected App Graph
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nx needs full history to calculate affected projects

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 17 Engine
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Install NPM Dependencies
        run: npm install --no-audit --no-fund

      - name: Synchronize Nx Affected Base Commit Context
        uses: nrwl/nx-set-shas@v4

      - name: Execute Polyglot Code Linters (Frontend)
        run: npx nx affected --target=lint --parallel=3

      # Runs before the Trivy scan (below) so ~/.m2 is populated with every
      # resolved dependency's POM/JAR first. Trivy's Java/pom.xml scanner
      # resolves parent/dependency-management inheritance by reading POMs;
      # with an empty local repo it fetches each one live from Maven
      # Central and reliably gets 429 Too Many Requests on repos with a
      # deep dependency tree (Spring Boot's BOM alone pulls in hundreds).
      # Populating the cache first means Trivy reads local files instead.
      - name: Run Java Backend Tests (Maven, Full Reactor)
        run: mvn -B -q verify

      - name: Run Vulnerability Scan on Dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "HIGH,CRITICAL"
          # Trivy's Java/pom.xml scanner resolves BOM and parent POM
          # inheritance via its own live network calls, independent of
          # Maven's local ~/.m2 cache — so it hits Maven Central directly
          # for every POM regardless of build order, and reliably gets
          # 429 Too Many Requests on Spring Boot's large BOM tree. Java
          # dependency currency is checked manually (see README §11.3),
          # so skip these files here rather than
          # fail every single PR on a scanner-side rate limit.
          skip-files: "**/pom.xml,**/build.gradle.kts"

      - name: Run Frontend Test Suites (Jest, Affected)
        run: npx nx affected --target=test --parallel=2 --configuration=ci

      - name: Run Frontend Production Build (Affected)
        run: npx nx affected --target=build --parallel=2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Run Java Backend Build (Gradle, Verification Parity)
        run: gradle build -x test --no-daemon

      - name: Upload JaCoCo Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: |
            apps/trade-capture-service/target/site/jacoco/**
            apps/pnl-risk-consumer/target/site/jacoco/**

  e2e:
    name: Frontend End-to-End (Playwright)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx nx e2e frontend
