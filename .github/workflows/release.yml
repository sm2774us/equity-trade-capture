name: Immutable Release & Changelog Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: write       # Allows pushing the CHANGELOG.md commit, tags, and GitHub Releases
  packages: write       # Pushing container images to GHCR
  id-token: write       # Sigstore requirement for cryptographic provenance
  attestations: write   # Storing build artifact proofs

jobs:
  release:
    name: Auto-Version, Changelog, and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Control
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nx requires full git history to parse commit messages for the changelog

      - name: Initialize Node Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 17 Engine for Secure Build
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Set Git Identity for Changelog Automation
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clean Install NPM Dependencies
        run: npm ci

      # Nx Release calculates version bumps from Conventional Commits,
      # edits/creates CHANGELOG.md, commits it, and tags it. The
      # `git-tag` current-version resolver (nx.json) needs --first-release
      # on the very first run, since there's no prior tag to diff from —
      # detect that automatically so this workflow doesn't need manual
      # editing after the repo's first release.
      - name: Determine First-Release Flag
        id: first-release-check
        run: |
          if git tag --list | grep -q .; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--first-release" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Nx Release (Generate Version, Changelog & Git Tag)
        id: nx-release
        run: npx nx release --skip-publish --dry-run=false ${{ steps.first-release-check.outputs.flag }}

      - name: Push Changelog Updates and Tags
        run: git push origin main --follow-tags

      - name: Compile Frontend Production Build
        run: npx nx run frontend:build:production

      - name: Compile Java Production Artifacts (Maven Reactor)
        run: mvn -B -q -DskipTests package

      - name: Generate Build Artifact Attestation (Provenance)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            apps/trade-capture-service/target/*.jar
            apps/pnl-risk-consumer/target/*.jar
            dist/apps/frontend/**/*

      - name: Compute Lowercase Repository Name (GHCR tags must be lowercase)
        id: repo-name
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push trade-capture-service Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/trade-capture-service/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo-name.outputs.lower }}/trade-capture-service:${{ steps.nx-release.outputs.version || github.sha }}

      - name: Build & Push pnl-risk-consumer Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/pnl-risk-consumer/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo-name.outputs.lower }}/pnl-risk-consumer:${{ steps.nx-release.outputs.version || github.sha }}

      - name: Build & Push frontend Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo-name.outputs.lower }}/frontend:${{ steps.nx-release.outputs.version || github.sha }}
