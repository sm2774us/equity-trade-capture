name: Repository Housekeeping (Prune Old Workflow Runs)

# GitHub never auto-deletes workflow run history — old failed/cancelled
# runs and superseded successful runs pile up in the Actions tab forever
# otherwise. This job keeps only the single most recent successful run
# per workflow and deletes everything else.
#
# Branch cleanup doesn't need a custom job: enabling "Automatically delete
# head branches" (Settings → General → Pull Requests) handles that for
# every PR, merged or closed, with no workflow required — see README §11.
#
# Runs weekly and can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  workflow_dispatch: {}

permissions:
  actions: write # delete workflow runs

jobs:
  prune-workflow-runs:
    name: Keep Only the Latest Successful Run Per Workflow
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workflow_file: [pr-verification.yml, release.yml, housekeeping.yml]
    steps:
      # Pass 1: delete every non-successful run (failure, cancelled,
      # skipped, timed-out) for this workflow — none of these need to be
      # kept around once superseded by any later run.
      - name: Delete failed/cancelled/skipped runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: ${{ matrix.workflow_file }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_run_by_conclusion_pattern: "cancelled,failure,skipped,timed_out,action_required"

      # Pass 2: for successful runs, keep only the single most recent one.
      - name: Delete all but the latest successful run
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: ${{ matrix.workflow_file }}
          retain_days: 0
          keep_minimum_runs: 1
          delete_run_by_conclusion_pattern: "success"
